<template>
    <lightning-card title="Add New Quote" icon-name="standard:add">
        <template if:true={isModelOpen}>
            <lightning-record-edit-form
                object-api-name="Quote"
                onsuccess={handleSuccess}
                onerror={handleError}
                onsubmit={handleSubmit}>
                <!-- for validation rules' errors to show -->
                <lightning-messages></lightning-messages> 

                <div class="slds-hide">
                    <lightning-input-field field-name="OpportunityId" value={recordId}></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                    <lightning-input-field field-name="Name" required></lightning-input-field>
                </div>
                <div class="slds-box slds-m-top_small">
                    <div class="slds-col">
                        <lightning-input-field field-name="Start_Date__c" onchange={handleS_Date}></lightning-input-field>
                    </div>
                    <div if:false={isLandType}>
                        <div class="slds-col">
                            <lightning-input-field field-name="End_Date__c" ></lightning-input-field>
                        </div>
                    </div>
                    <div class="slds-col">
                        <lightning-input-field field-name="Payment_Terms__c" ></lightning-input-field>
                    </div>
                    <div class="slds-col">
                        <lightning-input-field field-name="Grace_Period__c" ></lightning-input-field>
                    </div>
                    <div if:true={isRetailType}>
                        <div class="slds-grid">
                            <lightning-input-field field-name="Retail_Sales_Category__c" ></lightning-input-field>
                        </div>
                    </div>
                    <div if:true={isLandType}>
                        <div class="slds-grid">
                            <lightning-input-field field-name="Duration__c" ></lightning-input-field>
                        </div>
                        <div class="slds-grid">
                            <lightning-input-field field-name="Rent_Review_Frequency__c" ></lightning-input-field>
                        </div>
                        <div class="slds-hide">
                            <lightning-input-field field-name="End_Date__c" ></lightning-input-field>
                        </div>
                    </div>
                </div>
                <div class="slds-var-m-top_medium slds-text-align_right">
                    <lightning-button
                        class="slds-var-m-right_small"
                        label="Cancel"
                        onclick={closeModel}>
                    </lightning-button>
                    <lightning-button
                        type="submit"
                        label="Save Quote">
                    </lightning-button>
                </div>
            </lightning-record-edit-form>
        </template>
    </lightning-card>
</template>
