<template>
    <lightning-card title="Available Campaigns" icon-name="standard:campaign">
        <div class="slds-var-p-around_medium slds-is-relative">

            <template if:false={campaignwrappers}>
                <template if:false={errors}>
                    <lightning-spinner
                        alternative-text="Loading campaigns.."
                        size="medium"
                        variant="brand">
                    </lightning-spinner>
                </template>
            </template>

            <template if:true={filteredCamp}>
                <div class="slds-box slds-theme_shade slds-var-m-bottom_medium">
                    <div class="slds-text-title_caps slds-var-m-bottom_small">Filter Campaigns</div>

                    <div class="slds-grid slds-wrap slds-gutters">

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-var-m-bottom_small">
                            <lightning-input
                                name="nameFilter"
                                type="search"
                                value={namefilter}
                                label="Campaign Name"
                                placeholder="Search by name..."
                                onchange={handleFilterChange}>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-var-m-bottom_small">
                            <lightning-combobox
                                name="typeFilter"
                                label="Campaign Type"
                                value={typefilter}
                                placeholder="All Types"
                                options={typeOptions}
                                onchange={handleFilterChange}>
                            </lightning-combobox>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-var-m-bottom_small">
                            <lightning-input
                                name="startDateFilter"
                                type="date"
                                value={startdfilter}
                                label="Date Range from"
                                onchange={handleFilterChange}>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-var-m-bottom_small">
                            <lightning-input
                                name="endDateFilter"
                                type="date"
                                value={enddfilter}
                                label="Date Range to"
                                onchange={handleFilterChange}>
                            </lightning-input>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-wrap">
                    <template for:each={filteredCamp} for:item="camp">

                        <div key={camp.campaignId} class="slds-size_1-of-1 slds-var-m-bottom_small slds-box slds-box_x-small slds-theme_shade" style="border-left: 4px solid #0070d2;">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    
                                    <div>
                                        <h3 class="slds-text-heading_small slds-truncate">{camp.campaignName}</h3>
                                        <p class="slds-text-color_weak">Type: {camp.campaignType} | Status: {camp.campaignStatus}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-grid slds-wrap">
                    <template for:each={campaignwrappers} for:item="camp">

                        <template lwc:if={camp.isenrolled}>
                            <div key={camp.campaignId} class="slds-size_1-of-1 slds-var-m-bottom_small slds-box slds-box_x-small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">

                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-input
                                            type="checkbox"
                                            disabled
                                            class="slds-var-m-right_medium">
                                        </lightning-input>
                                        <div>
                                            <h3 class="slds-text-heading_small slds-truncate">{camp.campaignName}</h3>
                                            <p class="slds-text-color_weak">Type: {camp.campaignType} | Status: {camp.campaignStatus}</p>
                                            <p class="slds-text-body_small">
                                                Date: {camp.startdate} to {camp.enddate}
                                            </p>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <template if:true={camp.isactivestatus}>
                                            <span class="slds-badge slds-theme_success slds-var-m-right_x-small">Active</span>
                                        </template>

                                        <template if:true={camp.isenrolled}>
                                            <span class="slds-badge slds-theme_warning slds-var-m-right_x-small">Is Enrolled</span>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </template>
                        <template lwc:else>
                            <div key={camp.campaignId} class="slds-size_1-of-1 slds-var-m-bottom_small slds-box slds-box_x-small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-input
                                            type="checkbox"
                                            value={camp.campaignId}
                                            onchange={handleSelection}
                                            class="slds-var-m-right_medium">
                                        </lightning-input>
                                        <div>
                                            <h3 class="slds-text-heading_small slds-truncate">{camp.campaignName}</h3>
                                            <p class="slds-text-color_weak">Type: {camp.campaignType} | Status: {camp.campaignStatus}</p>
                                            <p class="slds-text-body_small">
                                                Date: {camp.startdate} to {camp.enddate}
                                            </p>
                                        </div>
                                    </div>

                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <template if:true={camp.isactivestatus}>
                                            <span class="slds-badge slds-theme_success slds-var-m-right_x-small">Active</span>
                                        </template>
                                        <template if:false={camp.isactivestatus}>
                                            <span class="slds-badge slds-theme_shade slds-var-m-right_x-small">Draft</span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <div class="slds-modal_footer slds-var-m-top_medium slds-grid slds-grid_align-end">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}
                    class="slds-var-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Continue"
                    variant="brand"
                    onclick={handleContinue}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
